<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<section th:fragment="content">
<section id="tab-documents" class="tab-panel active">
      <div class="panel-box">
        <div class="row" style="justify-content: space-between; margin-bottom: 0;">
          <h2 style="margin: 0;">사규</h2>
          <button id="docAddBtn" class="btn btn-primary">+ 사규 추가</button>
        </div>
      </div>
      <div class="row">
        <input id="documentsSearchInput" type="text" placeholder="제목/문서번호/담당자/키워드/근거 법령으로 빠르게 찾기" style="flex: 1;" />
        <span id="documentsSelectedCount" class="hint">0건 선택됨</span>
        <button id="documentsBulkDeleteBtn" class="btn btn-danger" disabled>선택 항목 삭제</button>
      </div>
      <div id="documentsTable" class="table-wrap">
<table>
<thead>
<tr>
<th>명칭</th>
<th>구분 / 상태</th>
</tr>
</thead>
<tbody>
<tr th:each="item : ${documents}">
<td th:text="${item.title}">
</td>
<td th:text="${item.revisionNo}">
</td>
</tr>
<tr th:if="${#lists.isEmpty(documents)}">
<td colspan="2">등록된 항목이 없습니다.</td>
</tr>
</tbody>
</table>
</div>
    </section>
<p class="hint">
<a href="/document-revisions" th:href="@{/document-revisions}">사규 저장 이력</a> · <a href="/document-impacts" th:href="@{/document-impacts}">법령 개정에 따른 검토 대상</a>
</p>
<div id="documentModalOverlay" class="modal-overlay" hidden>
      <div class="modal-box">
        <button type="button" id="docModalCloseBtn" class="modal-close" title="닫기" aria-label="닫기">&times;</button>
        <h2 id="documentFormTitle">사규 추가</h2>
        <form id="documentForm" class="grid-form">
<label class="full">변경 사유 <input id="docChangeReason" type="text" maxlength="4000" placeholder="변경 내용을 입력하세요" />
</label>
<label>변경 담당자 <input id="docChangedBy" type="text" maxlength="64" />
</label>
          <input type="hidden" id="docId" />
          <label>구분
            <select id="docType">
              <option>절차서</option>
              <option>지침서</option>
              <option>작업표준</option>
              <option>기타</option>
            </select>
          </label>
          <label>문서번호 <input id="docNumber" type="text" />
</label>
          <label>제목 <input id="docTitle" type="text" required />
</label>
          <label>개정번호 <input id="docRevisionNo" type="text" />
</label>
          <label>개정일자 <input id="docRevisionDate" type="text" placeholder="YYYYMMDD" />
</label>
          <label>담당자 <input id="docOwner" type="text" />
</label>
          <label>문서 링크 <input id="docFileLink" type="text" />
</label>
          <label class="full">키워드(해시태그) <input id="docTags" type="text" placeholder="#밀폐공간 #공기호흡기" />
            <span class="hint">근거 법령으로 직접 매핑하지 않아도, 이 키워드가 이름/본문에 들어간 법령·고시가 개정되면 자동으로 이 사규가 개정 필요 사항에 뜹니다. 공백으로 구분, "#"은 없어도 됩니다.</span>
          </label>
          <label class="full">근거 법령 (이 사규의 근거가 되는 법령·고시를 선택하면, 해당 법령이 개정될 때 이 사규가 대시보드의 "개정 필요 사항"에 표시됩니다)
            <div class="row">
              <select id="docLawCategoryFilter">
                <option value="">구분: 전체</option>
                <option value="0">법률</option>
                <option value="1">대통령령</option>
                <option value="2">부령(시행규칙)</option>
                <option value="3">고시·예규·훈령 등</option>
              </select>
              <input id="docLawSearchInput" type="text" placeholder="법령명으로 검색" />
            </div>
            <div id="docLawCheckboxes" class="checkbox-list">
</div>
          </label>
          <label class="full">비고 <textarea id="docNote">
</textarea>
</label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">저장</button>
            <button type="button" id="docCancelBtn" class="btn">취소</button>
          </div>
        </form>
      </div>
    </div>
</section>
</body>
</html>
