<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::content})}">
<body>
<section th:fragment="content">
<section id="tab-news" class="tab-panel active">
      <div class="panel-box">
        <div class="row" style="justify-content: space-between; margin-bottom: 0;">
          <h2 style="margin: 0;">안전보건 이슈 · 중대재해 뉴스</h2>
          <span id="newsPageDemoBadge" class="badge badge-warn" hidden title="실제 뉴스를 아직 못 가져와 예시 데이터로 채워져 있습니다">예시 데이터</span>
        </div>
        <p class="hint">
          고용노동부·안전보건공단 안전보건 이슈, 중대재해 관련 뉴스를 카테고리·키워드·날짜로 검색합니다.
          최근 뉴스만 훑어보려면 대시보드 상단의 자동 스크롤 게시판을 이용하고, 예전 기사를 찾거나 특정 기간의
          사고 소식을 모아보려면 여기서 검색하세요. 뉴스는 발행일 기준 설정 &gt; 안전보건 뉴스 게시판의
          <b>"보관 기간"</b>(기본 6개월)이 지나면 자동 삭제되므로 그보다 오래된 기사는 나오지 않습니다 · 계속 남겨두고
          싶은 기사는 목록에서 <b>"보관"</b>을 눌러두면 기간이 지나도 삭제되지 않습니다.
        </p>
        <div class="row news-board-filters" id="newsPageCategoryFilters">
          <button type="button" class="news-filter-btn active" data-cat="">전체</button>
          <button type="button" class="news-filter-btn" data-cat="moel">고용노동부</button>
          <button type="button" class="news-filter-btn" data-cat="kosha">안전보건공단</button>
          <button type="button" class="news-filter-btn" data-cat="accident">중대재해 뉴스(사망사고)</button>
          <button type="button" class="news-filter-btn" data-cat="issue">안전보건 이슈</button>
        </div>
        <form id="newsPageSearchForm" class="row">
          <input id="newsPageQueryInput" type="text" placeholder="제목으로 검색 (예: 중대재해, 추락)" style="flex: 1; min-width: 200px;" />
          <label>시작일 <input id="newsPageDateFrom" type="date" />
</label>
          <label>종료일 <input id="newsPageDateTo" type="date" />
</label>
          <label>
<input type="checkbox" id="newsPageArchivedOnly" /> 보관함만 보기</label>
          <button type="submit" class="btn btn-primary">검색</button>
          <button type="button" id="newsPageResetBtn" class="btn">초기화</button>
        </form>
        <p id="newsPageSearchStatus" class="hint">
</p>
        <div id="newsPageResults" class="table-wrap">
</div>
      </div>
    </section>
</section>
</body>
</html>
