spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/local;MODE=Oracle;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-local.sql
app:
  demo: true
  auth:
    development-login-enabled: ${DEV_LOGIN_ENABLED:true}
