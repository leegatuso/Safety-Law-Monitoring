server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: safety-law-monitoring
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${SAFETY_LAW_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${SAFETY_LAW_DB_USERNAME:safety_law}
    password: ${SAFETY_LAW_DB_PASSWORD:}
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    call-setters-on-nulls: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  demo: false
  files-dir: ${SAFETY_LAW_FILES_DIR:./data/kosha}
  username: ${DASHBOARD_USERNAME:}
  password: ${DASHBOARD_PASSWORD:}
  sync-delay-ms: ${AUTO_SYNC_DELAY_MS:86400000}
  news-delay-ms: ${NEWS_FETCH_DELAY_MS:10800000}
